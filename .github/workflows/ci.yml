name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Build
        run: go build ./...

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-amd64
          - os: ubuntu-latest
            name: linux-amd64
          - os: macos-latest
            name: darwin-amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install Linux X11 dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxext-dev libxrandr-dev
      - name: Build teacher and student
        shell: bash
        run: |
          go build -o teacher ./cmd/teacher
          go build -o student ./cmd/student
      - name: Cross-compile darwin amd64 (cgo)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          CGO_ENABLED=1 GOOS=darwin GOARCH=amd64 \
            CC="$(xcrun -f clang) -arch x86_64" go build ./...
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tianyan-${{ matrix.name }}
          path: |
            teacher
            student
            teacher.exe
            student.exe

  # Cross-compile guard: every release target (UOS/Kylin LoongArch/MIPS,
  # Linux arm64, Android, macOS arches) must keep compiling as the codebase
  # evolves. Static (CGO disabled) builds — same as release packaging.
  cross-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Verify all release targets compile
        shell: bash
        run: |
          set -e
          # darwin is excluded here: its screen capture requires cgo and is
          # exercised natively (incl. amd64 cross) in the macOS build job.
          for target in \
            "windows amd64 1" \
            "linux amd64 0" \
            "linux arm64 0" \
            "linux loong64 0" \
            "linux mips64le 0" \
            "android arm64 0"; do
            set -- $target
            echo "== $1/$2 (CGO=$3) =="
            CGO_ENABLED=$3 GOOS=$1 GOARCH=$2 go build ./...
          done
