<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" font-family="'Microsoft YaHei','PingFang SC','Segoe UI',sans-serif">
  <defs>
    <linearGradient id="scrBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d4ed8"/><stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="scrPurple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6d28d9"/><stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="scrGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#059669"/><stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="scrOrange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ea580c"/><stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="scrTeal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d9488"/><stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
    <linearGradient id="scrRed" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dc2626"/><stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="1000" height="560" fill="#0f172a"/>

  <!-- 顶栏 -->
  <rect width="1000" height="48" fill="#1e293b"/>
  <line x1="0" y1="48" x2="1000" y2="48" stroke="#334155"/>
  <text x="16" y="31" font-size="20" font-weight="700" fill="#38bdf8">天眼</text>
  <text x="62" y="31" font-size="12" fill="#94a3b8">电子教室 · 教师端</text>

  <!-- 工具栏按钮 -->
  <g font-size="11" fill="#e2e8f0" text-anchor="middle">
    <rect x="180" y="11" width="86" height="26" rx="6" fill="#334155" stroke="#475569"/><text x="223" y="28">🔇 全体静音</text>
    <rect x="272" y="11" width="86" height="26" rx="6" fill="#334155" stroke="#475569"/><text x="315" y="28">⬛ 全体黑屏</text>
    <rect x="364" y="11" width="86" height="26" rx="6" fill="#334155" stroke="#475569"/><text x="407" y="28">🌐 打开网页</text>
    <rect x="456" y="11" width="86" height="26" rx="6" fill="#334155" stroke="#475569"/><text x="499" y="28">📦 打开应用</text>
    <rect x="548" y="11" width="86" height="26" rx="6" fill="#334155" stroke="#475569"/><text x="591" y="28">❌ 关闭应用</text>
    <rect x="640" y="11" width="86" height="26" rx="6" fill="#334155" stroke="#475569"/><text x="683" y="28">🚫 关闭网页</text>
    <rect x="732" y="11" width="64" height="26" rx="6" fill="#334155" stroke="#475569"/><text x="764" y="28">⏻ 关机</text>
    <rect x="802" y="11" width="82" height="26" rx="6" fill="#334155" stroke="#475569"/><text x="843" y="28">🛡️ 黑白名单</text>
  </g>

  <!-- 学生网格 -->
  <g font-size="12" fill="#e2e8f0">
    <!-- 卡片1：浏览器 -->
    <g>
      <rect x="12" y="64" width="215" height="150" rx="10" fill="#1e293b" stroke="#334155"/>
      <rect x="18" y="70" width="203" height="92" rx="4" fill="url(#scrBlue)"/>
      <rect x="28" y="80" width="150" height="72" rx="3" fill="#f8fafc"/>
      <rect x="28" y="80" width="150" height="16" rx="3" fill="#e2e8f0"/>
      <circle cx="37" cy="88" r="3" fill="#ef4444"/><circle cx="48" cy="88" r="3" fill="#f59e0b"/><circle cx="59" cy="88" r="3" fill="#22c55e"/>
      <rect x="34" y="102" width="100" height="6" rx="3" fill="#cbd5e1"/>
      <rect x="34" y="114" width="120" height="6" rx="3" fill="#cbd5e1"/>
      <rect x="34" y="126" width="60" height="6" rx="3" fill="#93c5fd"/>
      <text x="18" y="124" font-size="12" font-weight="600" fill="#e2e8f0">01号机 · 李同学</text>
      <text x="18" y="140" font-size="10" fill="#94a3b8">192.168.31.11 · 在线</text>
    </g>

    <!-- 卡片2：代码编辑器 -->
    <g>
      <rect x="237" y="64" width="215" height="150" rx="10" fill="#1e293b" stroke="#334155"/>
      <rect x="243" y="70" width="203" height="92" rx="4" fill="url(#scrPurple)"/>
      <rect x="253" y="80" width="150" height="72" rx="3" fill="#0b1220"/>
      <rect x="262" y="90" width="90" height="6" rx="3" fill="#38bdf8"/>
      <rect x="262" y="102" width="120" height="6" rx="3" fill="#34d399"/>
      <rect x="262" y="114" width="70" height="6" rx="3" fill="#f472b6"/>
      <text x="243" y="124" font-size="12" font-weight="600" fill="#e2e8f0">02号机 · 王同学</text>
      <text x="243" y="140" font-size="10" fill="#94a3b8">192.168.31.12 · 在线</text>
      <rect x="419" y="70" width="21" height="18" rx="4" fill="#f59e0b"/><text x="425" y="83" font-size="10" fill="#1e293b">✋</text>
    </g>

    <!-- 卡片3：图表 -->
    <g>
      <rect x="462" y="64" width="215" height="150" rx="10" fill="#1e293b" stroke="#334155"/>
      <rect x="468" y="70" width="203" height="92" rx="4" fill="url(#scrGreen)"/>
      <rect x="478" y="80" width="150" height="72" rx="3" fill="#f8fafc"/>
      <rect x="486" y="128" width="18" height="18" rx="2" fill="#34d399"/>
      <rect x="510" y="112" width="18" height="34" rx="2" fill="#10b981"/>
      <rect x="534" y="96" width="18" height="50" rx="2" fill="#059669"/>
      <text x="468" y="124" font-size="12" font-weight="600" fill="#e2e8f0">03号机 · 张同学</text>
      <text x="468" y="140" font-size="10" fill="#94a3b8">192.168.31.13 · 在线</text>
    </g>

    <!-- 卡片4：视频播放 -->
    <g>
      <rect x="12" y="224" width="215" height="150" rx="10" fill="#1e293b" stroke="#334155"/>
      <rect x="18" y="230" width="203" height="92" rx="4" fill="url(#scrOrange)"/>
      <rect x="28" y="240" width="183" height="72" rx="3" fill="#0b1220"/>
      <polygon points="112,262 112,290 142,276" fill="#fbbf24"/>
      <text x="18" y="284" font-size="12" font-weight="600" fill="#e2e8f0">04号机 · 陈同学</text>
      <text x="18" y="300" font-size="10" fill="#94a3b8">192.168.31.14 · 在线</text>
      <rect x="200" y="230" width="21" height="18" rx="4" fill="#0ea5e9"/><text x="207" y="243" font-size="10" fill="#0f172a">🔇</text>
    </g>

    <!-- 卡片5：文档 -->
    <g>
      <rect x="237" y="224" width="215" height="150" rx="10" fill="#1e293b" stroke="#334155"/>
      <rect x="243" y="230" width="203" height="92" rx="4" fill="url(#scrTeal)"/>
      <rect x="253" y="240" width="183" height="72" rx="3" fill="#f8fafc"/>
      <rect x="262" y="250" width="150" height="6" rx="3" fill="#cbd5e1"/>
      <rect x="262" y="262" width="130" height="6" rx="3" fill="#cbd5e1"/>
      <rect x="262" y="274" width="110" height="6" rx="3" fill="#cbd5e1"/>
      <text x="243" y="284" font-size="12" font-weight="600" fill="#e2e8f0">05号机 · 刘同学</text>
      <text x="243" y="300" font-size="10" fill="#94a3b8">192.168.31.15 · 离线</text>
      <rect x="419" y="230" width="21" height="18" rx="4" fill="#475569"/><text x="424" y="243" font-size="10" fill="#e2e8f0">🔒</text>
    </g>

    <!-- 卡片6：游戏（被管控） -->
    <g>
      <rect x="462" y="224" width="215" height="150" rx="10" fill="#1e293b" stroke="#334155"/>
      <rect x="468" y="230" width="203" height="92" rx="4" fill="url(#scrRed)"/>
      <circle cx="530" cy="276" r="18" fill="#f472b6"/>
      <circle cx="574" cy="262" r="12" fill="#fbbf24"/>
      <rect x="494" y="288" width="90" height="14" rx="4" fill="#f8fafc"/>
      <text x="468" y="284" font-size="12" font-weight="600" fill="#e2e8f0">06号机 · 赵同学</text>
      <text x="468" y="300" font-size="10" fill="#94a3b8">192.168.31.16 · 在线</text>
      <rect x="640" y="230" width="21" height="18" rx="4" fill="#dc2626"/><text x="645" y="243" font-size="10" fill="#fff">⬛</text>
    </g>
  </g>

  <!-- 右侧消息面板 -->
  <rect x="700" y="48" width="300" height="512" fill="#1e293b"/>
  <line x1="700" y1="48" x2="700" y2="560" stroke="#334155"/>
  <text x="716" y="76" font-size="14" fill="#94a3b8">消息 / 事件</text>
  <g font-size="11" fill="#cbd5e1">
    <rect x="712" y="88" width="276" height="40" rx="6" fill="#0f172a"/>
    <text x="722" y="105" fill="#94a3b8">10:02:11</text>
    <text x="722" y="120">02号机 · 王同学: 举手提问</text>
    <rect x="712" y="136" width="276" height="40" rx="6" fill="#0f172a"/>
    <text x="722" y="153" fill="#94a3b8">10:02:40</text>
    <text x="722" y="168">03号机 · 张同学: 已提交作业 练习.docx</text>
    <rect x="712" y="184" width="276" height="40" rx="6" fill="#0f172a"/>
    <text x="722" y="201" fill="#94a3b8">10:03:05</text>
    <text x="722" y="216">06号机: 【管控】检测到从U盘运行游戏，已关闭</text>
  </g>
</svg>
